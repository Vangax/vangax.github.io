<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="ui-sans-serif,system-ui,sans-serif">
<rect width="720" height="300" fill="#fcfcfb"/>
<text x="24" y="32" font-size="16" font-weight="600" fill="#1a1a19">Why you cannot pass the favour down the line</text>
<text x="24" y="54" font-size="11.5" fill="#6b6a63">A neuron that only thinks it knows where it is will hand you its confusion as if it were a fact.</text>
<g transform="translate(60,100)">
<circle cx="0" cy="30" r="16" fill="#1baf7a"/><text x="0" y="35" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L</text>
<text x="0" y="72" font-size="10.5" fill="#1baf7a" text-anchor="middle" font-weight="600">real landmark</text>
<text x="0" y="86" font-size="10" fill="#6b6a63" text-anchor="middle">error 0</text>
<g stroke="#9b9a92" stroke-width="1.4" marker-end="url(#ar)"><line x1="20" y1="30" x2="118" y2="30"/></g>
<circle cx="140" cy="30" r="16" fill="#eb6834" opacity=".85"/><text x="140" y="35" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="140" y="72" font-size="10.5" fill="#6b6a63" text-anchor="middle">borrows the fix</text>
<text x="140" y="86" font-size="10" fill="#eb6834" text-anchor="middle" font-weight="600">error ~71 µm</text>
<line x1="160" y1="30" x2="258" y2="30" stroke="#9b9a92" stroke-width="1.4"/>
<circle cx="280" cy="30" r="16" fill="#eb6834" opacity=".62"/><text x="280" y="35" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="280" y="72" font-size="10.5" fill="#6b6a63" text-anchor="middle">borrows from #1</text>
<text x="280" y="86" font-size="10" fill="#eb6834" text-anchor="middle" font-weight="600">error grows</text>
<line x1="300" y1="30" x2="398" y2="30" stroke="#9b9a92" stroke-width="1.4"/>
<circle cx="420" cy="30" r="16" fill="#eb6834" opacity=".38"/><text x="420" y="35" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="420" y="72" font-size="10.5" fill="#6b6a63" text-anchor="middle">borrows from #2</text>
<text x="420" y="86" font-size="10" fill="#eb6834" text-anchor="middle" font-weight="600">worse again</text>
<line x1="440" y1="30" x2="520" y2="30" stroke="#9b9a92" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="560" y="35" font-size="11.5" fill="#6b6a63">drifts off</text>
</g>
<rect x="60" y="228" width="600" height="50" rx="10" fill="#f2f1ec"/>
<text x="78" y="250" font-size="11.5" fill="#1a1a19">Four rounds of this and the map got steadily worse, not better: 102 → 115 µm. It is dead reckoning.</text>
<text x="78" y="268" font-size="11.5" fill="#1a1a19">A landmark only helps if it knows where it is <tspan font-weight="600">far better</tspan> than the mistake you are asking it to fix.</text>
</svg>
