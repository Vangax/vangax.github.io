<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="ui-sans-serif,system-ui,sans-serif">
<rect width="720" height="330" fill="#fcfcfb"/>
<text x="24" y="32" font-size="16" font-weight="600" fill="#1a1a19">Two kinds of wrongness, and only one of them is fixable</text>
<g transform="translate(40,60)">
<text x="0" y="0" font-size="12.5" font-weight="600" fill="#1a1a19">TRUTH</text>
<g stroke="#c9c8c1" stroke-width="1"><path d="M0 14h150M0 47h150M0 80h150M0 113h150M0 146h150M0 14v132M37 14v132M75 14v132M112 14v132M150 14v132"/></g>
<g fill="#1a1a19">
<circle cx="37" cy="47" r="4"/><circle cx="75" cy="47" r="4"/><circle cx="75" cy="80" r="4"/><circle cx="112" cy="113" r="4"/><circle cx="37" cy="113" r="4"/></g>
<text x="0" y="176" font-size="10.5" fill="#6b6a63">where the neurons really are</text>
</g>
<g transform="translate(255,60)">
<text x="0" y="0" font-size="12.5" font-weight="600" fill="#2a78d6">THE WARP</text>
<g stroke="#2a78d6" stroke-width="1" opacity=".45" fill="none">
<path d="M2 20 C40 10, 110 22, 152 12"/><path d="M0 52 C40 44, 112 56, 150 45"/><path d="M2 84 C42 78, 108 88, 153 78"/><path d="M0 116 C38 110, 114 120, 151 110"/><path d="M3 148 C40 142, 110 152, 150 143"/>
<path d="M2 20 C-2 60, 6 110, 3 148"/><path d="M39 16 C35 56, 43 106, 40 146"/><path d="M77 21 C73 61, 81 111, 78 150"/><path d="M114 17 C110 57, 118 107, 115 147"/><path d="M152 12 C148 52, 156 102, 150 143"/></g>
<g fill="#2a78d6"><circle cx="41" cy="50" r="4"/><circle cx="79" cy="55" r="4"/><circle cx="79" cy="87" r="4"/><circle cx="117" cy="117" r="4"/><circle cx="42" cy="115" r="4"/></g>
<text x="0" y="176" font-size="10.5" fill="#6b6a63">whole sheet bends smoothly.</text>
<text x="0" y="191" font-size="10.5" fill="#2a78d6" font-weight="600">neighbours stay neighbours</text>
</g>
<g transform="translate(470,60)">
<text x="0" y="0" font-size="12.5" font-weight="600" fill="#eb6834">THE BLUR</text>
<g stroke="#c9c8c1" stroke-width="1"><path d="M0 14h150M0 47h150M0 80h150M0 113h150M0 146h150M0 14v132M37 14v132M75 14v132M112 14v132M150 14v132"/></g>
<g fill="#eb6834"><circle cx="58" cy="36" r="4"/><circle cx="61" cy="61" r="4"/><circle cx="93" cy="70" r="4"/><circle cx="97" cy="126" r="4"/><circle cx="20" cy="104" r="4"/></g>
<g stroke="#eb6834" stroke-width="1" stroke-dasharray="2 2" opacity=".6">
<line x1="37" y1="47" x2="58" y2="36"/><line x1="75" y1="47" x2="61" y2="61"/><line x1="75" y1="80" x2="93" y2="70"/><line x1="112" y1="113" x2="97" y2="126"/><line x1="37" y1="113" x2="20" y2="104"/></g>
<text x="0" y="176" font-size="10.5" fill="#6b6a63">each dot jumps on its own.</text>
<text x="0" y="191" font-size="10.5" fill="#eb6834" font-weight="600">neighbours get scrambled</text>
</g>
<rect x="40" y="270" width="640" height="44" rx="10" fill="#f2f1ec"/>
<text x="58" y="290" font-size="11.5" fill="#1a1a19">Landmarks can un-bend a warp, because the bend is shared. Nothing can un-scramble a blur, because every</text>
<text x="58" y="307" font-size="11.5" fill="#1a1a19">neuron's jump is its own. And it turns out the brain gives us mostly blur — which is the hard one.</text>
</svg>
