<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="ui-sans-serif,system-ui,sans-serif">
<rect width="720" height="300" fill="#fcfcfb"/>
<text x="24" y="32" font-size="16" font-weight="600" fill="#1a1a19">Why the ratio survives what the amount does not</text>
<text x="24" y="54" font-size="11.5" fill="#6b6a63">Two neurons sitting in the exact same spot. One just takes up barcode three times more greedily than the other.</text>
<g transform="translate(60,86)">
<text x="0" y="0" font-size="12" font-weight="600" fill="#1a1a19">Greedy neuron</text>
<rect x="0" y="14" width="150" height="19" rx="3" fill="#2a78d6" opacity=".85"/><text x="158" y="28" font-size="11" fill="#6b6a63">15,300</text>
<rect x="0" y="39" width="69" height="19" rx="3" fill="#eb6834" opacity=".85"/><text x="158" y="53" font-size="11" fill="#6b6a63">7,050</text>
<rect x="0" y="64" width="75" height="19" rx="3" fill="#1baf7a" opacity=".85"/><text x="158" y="78" font-size="11" fill="#6b6a63">7,650</text>
<text x="0" y="112" font-size="11" fill="#1a1a19">as a share:  <tspan font-weight="600">51% / 23% / 26%</tspan></text>
</g>
<g transform="translate(400,86)">
<text x="0" y="0" font-size="12" font-weight="600" fill="#1a1a19">Shy neuron</text>
<rect x="0" y="14" width="50" height="19" rx="3" fill="#2a78d6" opacity=".85"/><text x="158" y="28" font-size="11" fill="#6b6a63">5,100</text>
<rect x="0" y="39" width="23" height="19" rx="3" fill="#eb6834" opacity=".85"/><text x="158" y="53" font-size="11" fill="#6b6a63">2,350</text>
<rect x="0" y="64" width="25" height="19" rx="3" fill="#1baf7a" opacity=".85"/><text x="158" y="78" font-size="11" fill="#6b6a63">2,550</text>
<text x="0" y="112" font-size="11" fill="#1a1a19">as a share:  <tspan font-weight="600">51% / 23% / 26%</tspan></text>
</g>
<rect x="60" y="216" width="600" height="56" rx="10" fill="#f2f1ec"/>
<text x="80" y="240" font-size="12" fill="#1a1a19"><tspan font-weight="600">Totals differ by 3x. Shares are identical.</tspan> Every messy thing — how well the virus infected the cell,</text>
<text x="80" y="258" font-size="12" fill="#1a1a19">how deep you sequenced — multiplies all bars equally, so it divides out. That is the whole trick.</text>
</svg>
