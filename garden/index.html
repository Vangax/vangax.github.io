<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>the prism</title>
<meta name="description" content="vang's blog. it lives inside the prism. get in and read." />
<meta name="theme-color" content="#03080A" />
<meta property="og:title" content="the prism" />
<meta property="og:description" content="get in the heavy hearts club. every chapter is a lit compartment inside the prism." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2303080A'/%3E%3Cpath d='M32 9 58 55H6Z' fill='none' stroke='%236BF4D8' stroke-width='3'/%3E%3Cpath d='M32 9v46M19 32h26M12.5 43h39' stroke='%236BF4D8' stroke-width='1.6' opacity='.75'/%3E%3Cpath d='M32 9 24 23h16Z' fill='%23AFFFF0'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/dogtown.css" />
</head>
<body data-stage="boot">

<div id="plate">
  <div class="plate-fit" id="plateFit">
    <img id="plateImg" alt="" draggable="false" />
    <canvas id="plateFall" aria-hidden="true"></canvas>
    <svg id="plateHot" viewBox="0 0 2000 1125" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="hotFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#DFFFF7" stop-opacity=".40"/>
          <stop offset="55%"  stop-color="#6BF4D8" stop-opacity=".22"/>
          <stop offset="100%" stop-color="#6BF4D8" stop-opacity=".06"/>
        </linearGradient>
      </defs>
      <polygon id="hotTri" points="1113,204 846,602 1434,594" />
      <polygon id="hotEdge" points="1113,204 846,602 1434,594" />
    </svg>
  </div>
</div>

<canvas id="stage" aria-hidden="true"></canvas>

<div class="atmo" aria-hidden="true">
  <div class="atmo-scan"></div>
  <div class="atmo-grain"></div>
  <div class="atmo-vig"></div>
</div>
<div id="bloom" aria-hidden="true"></div>

<div class="hud" id="hud">
  <div class="hud-tl">
    <div class="hb">
      <span class="hb-k">local</span>
      <b class="hb-v" id="hClock">--:--:--</b>
      <span class="hb-s" id="hDate">&nbsp;</span>
    </div>
    <div class="hb">
      <span class="hb-k">origin</span>
      <b class="hb-v sm" id="hWhere">tracing…</b>
      <span class="hb-s" id="hCoord">&nbsp;</span>
    </div>
  </div>

  <div class="hud-tr">
    <div class="hb r">
      <span class="hb-k">visitors</span>
      <b class="hb-v" id="hVisits">—</b>
      <span class="hb-s">links opened</span>
    </div>
    <div class="hb r">
      <span class="hb-k">node</span>
      <b class="hb-v sm">DGT&thinsp;/&thinsp;07</b>
      <span class="hb-s" id="hLink">link stable</span>
    </div>
  </div>

  <div class="hud-bl">
    <label class="scan" id="scan">
      <span class="sc-k">scan</span>
      <input id="scanIn" type="search" placeholder="search every compartment…"
             autocomplete="off" spellcheck="false" aria-label="Search the archive" />
      <span class="sc-n" id="scanBox"></span>
    </label>
    <button class="back" id="btnBack" type="button" hidden>
      <span class="bk-a">&#8592;</span><span class="bk-t" id="bkLabel">pull out</span>
    </button>
  </div>

  <div class="hud-br">
    <div class="probe" id="probe" hidden>
      <span class="pr-n" id="prNum">01</span>
      <span class="pr-b"><b id="prName">&mdash;</b><i id="prMeta">&mdash;</i><u id="prStat"></u></span>
    </div>
  </div>
</div>

<div class="lede" id="lede">
  <div class="lede-in">
    <div class="lede-hint"><span class="ring"></span>get in the heavy hearts club</div>
  </div>
</div>

<div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="rdTitle" hidden>
  <div class="rd-sheet">
    <div class="rd-bar">
      <span class="rd-cell" id="rdCell">CMP&nbsp;01</span>
      <span class="rd-dot"></span>
      <span class="rd-rule" id="rdRule">&nbsp;</span>
      <span class="rd-sp"></span>
      <div class="rd-index" id="rdIndex" hidden></div>
      <span class="rd-meta" id="rdMeta">&nbsp;</span>
      <div class="rd-size" role="group" aria-label="Text size">
        <button data-sz="-1" type="button" aria-label="Smaller text">A</button>
        <button data-sz="0"  type="button" aria-label="Reset text size">A</button>
        <button data-sz="1"  type="button" aria-label="Larger text">A</button>
      </div>
      <button class="rd-x" id="rdClose" type="button" aria-label="Close">&#10005;</button>
    </div>
    <div class="rd-prog"><i id="rdProg"></i></div>
    <div class="rd-scroll" id="rdScroll" tabindex="0">
      <div class="rd-page">
        <div class="rd-kick" id="rdKick">&nbsp;</div>
        <h1 id="rdTitle">&nbsp;</h1>
        <div class="rd-by" id="rdBy">&nbsp;</div>
        <div class="rd-body" id="rdBody"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/text.js"></script>
<script type="module" src="js/garden-cloud.js"></script>
<script src="js/plate.js"></script>
<script src="js/monument.js"></script>
<script src="js/app.js"></script>
</body>
</html>
